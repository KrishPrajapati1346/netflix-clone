name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real MongoDB rather than mocks, so index
      # behaviour and unique constraints are actually exercised.
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The shared package is consumed as compiled output, so it must be built
      # before anything typechecks against it.
      - name: Build shared contracts
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          NODE_ENV: test
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/kinora_ci
          JWT_ACCESS_SECRET: ci-access-secret-value-not-used-in-any-deployment
          JWT_REFRESH_SECRET: ci-refresh-secret-value-not-used-in-any-deployment

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Advisory, not blocking: a transitive dev-only advisory should not stop a
      # release, but it should be visible on every run.
      - run: npm audit --audit-level=high || true
